<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConecta - Gestão de Professores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-mortarboard-fill me-2"></i>EduConecta</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" href="alunos.html">Alunos</a>
        <a class="nav-link active" href="professores.html">Professores</a>
        <a class="nav-link" href="cursos.html">Cursos</a>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3><i class="bi bi-person-badge-fill text-success me-2"></i>Módulo de Professores</h3>
      <span class="badge bg-success fs-6">Responsável: Integrante 2</span>
    </div>

    <!-- Formulário -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-bold text-success">Cadastro / Edição de Professor</div>
      <div class="card-body">
        <form id="form-professor">
          <input type="hidden" id="prof-id">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nome Completo</label>
              <input type="text" class="form-control" id="prof-nome" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">E-mail Acadêmico</label>
              <input type="email" class="form-control" id="prof-email" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Titulação</label>
              <select class="form-select" id="prof-titulacao" required>
                <option value="Graduado">Graduado</option>
                <option value="Especialista">Especialista</option>
                <option value="Mestre">Mestre</option>
                <option value="Doutor">Doutor</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Área de Atuação</label>
              <input type="text" class="form-control" id="prof-area" placeholder="Ex: Engenharia de Software" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Telefone</label>
              <input type="text" class="form-control" id="prof-telefone" placeholder="(00) 00000-0000" required>
            </div>
          </div>
          <div class="mt-3 text-end">
            <button type="button" class="btn btn-secondary d-none" id="btn-cancelar" onclick="cancelarEdicao()">Cancelar</button>
            <button type="submit" class="btn btn-success" id="btn-salvar"><i class="bi bi-check-circle me-1"></i> Salvar Professor</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
      <div class="card-header bg-white fw-bold text-secondary">Professores Cadastrados</div>
      <div class="card-body p-0 table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Nome</th>
              <th>Titulação</th>
              <th>Área</th>
              <th>E-mail</th>
              <th>Telefone</th>
              <th class="text-center" style="width: 140px;">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-professores"></tbody>
        </table>
      </div>
    </div>
  </div>

<script src="professores.js"></script>
</body>
</html>
