<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConecta - Gestão de Cursos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-mortarboard-fill me-2"></i>EduConecta</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" href="alunos.html">Alunos</a>
        <a class="nav-link" href="professores.html">Professores</a>
        <a class="nav-link active" href="cursos.html">Cursos</a>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3><i class="bi bi-book-fill text-warning me-2"></i>Módulo de Cursos</h3>
      <span class="badge bg-warning text-dark fs-6">Responsável: Integrante 3</span>
    </div>

    <!-- Formulário -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-bold text-warning">Cadastro / Edição de Curso</div>
      <div class="card-body">
        <form id="form-curso">
          <input type="hidden" id="curso-id">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nome do Curso</label>
              <input type="text" class="form-control" id="curso-nome" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Carga Horária (h)</label>
              <input type="number" class="form-control" id="curso-carga" min="1" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Modalidade</label>
              <select class="form-select" id="curso-modalidade" required>
                <option value="Presencial">Presencial</option>
                <option value="EaD">EaD</option>
                <option value="Semipresencial">Semipresencial</option>
              </select>
            </div>
            <div class="col-md-12">
              <label class="form-label">Ementa / Descrição</label>
              <input type="text" class="form-control" id="curso-descricao" placeholder="Resumo dos objetivos e tópicos abordados" required>
            </div>
          </div>
          <div class="mt-3 text-end">
            <button type="button" class="btn btn-secondary d-none" id="btn-cancelar" onclick="cancelarEdicao()">Cancelar</button>
            <button type="submit" class="btn btn-warning" id="btn-salvar"><i class="bi bi-check-circle me-1"></i> Salvar Curso</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
      <div class="card-header bg-white fw-bold text-secondary">Cursos Cadastrados</div>
      <div class="card-body p-0 table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Curso</th>
              <th>Carga Horária</th>
              <th>Modalidade</th>
              <th>Ementa</th>
              <th class="text-center" style="width: 140px;">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-cursos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="cursos.js"></script>
</body>
</html>
