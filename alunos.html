<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConecta - Gestão de Alunos</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-mortarboard-fill me-2"></i>EduConecta
      </a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Início</a>
        
        <a class="nav-link active" href="alunos.html">Alunos</a>
        <a class="nav-link" href="professores.html">Professores</a>
        <a class="nav-link" href="cursos.html">Cursos</a>
      </div>
    </div>
  </nav>

  
  <div class="container pb-5">
    
    
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3><i class="bi bi-people-fill text-primary me-2"></i>Módulo de Alunos</h3>
      <span class="badge bg-primary fs-6">Responsável: Pietro Gasparin Lavalle</span>
    </div>

    
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white fw-bold text-primary">Cadastro / Edição de Aluno</div>
      <div class="card-body">
        
        
        <form id="form-aluno">
          
          <!-- Guarda o ID do aluno.
               Vazio = Cadastrar novo aluno 
               Com valor = Atualizar aluno existente -->
          <input type="hidden" id="aluno-id">

          <div class="row g-3">
            
            <div class="col-md-5">
              <label class="form-label">Nome Completo</label>
              <input type="text" class="form-control" id="aluno-nome" required>
            </div>
            
            
            <div class="col-md-4">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-control" id="aluno-email" required>
            </div>
            
            
            <div class="col-md-3">
              <label class="form-label">Matrícula</label>
              <input type="text" class="form-control" id="aluno-matricula" required>
            </div>
            
            
            <div class="col-md-6">
              <label class="form-label">Curso</label>
              <input type="text" class="form-control" id="aluno-curso" required>
            </div>
            
            
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <select class="form-select" id="aluno-status" required>
                <option value="Ativo">Ativo</option>
                <option value="Trancado">Trancado</option>
                <option value="Concluído">Concluído</option>
              </select>
            </div>
          </div>

          
          <div class="mt-3 text-end">
            
            <button type="button" class="btn btn-secondary d-none" id="btn-cancelar" onclick="cancelarEdicaoAluno()">
              Cancelar
            </button>
            
            
            <button type="submit" class="btn btn-primary" id="btn-salvar">
              <i class="bi bi-check-circle me-1"></i> Salvar Aluno
            </button>
          </div>
        </form>

      </div>
    </div>

    
    <div class="card shadow-sm">
      <div class="card-header bg-white fw-bold text-secondary">Alunos Cadastrados</div>
      <div class="card-body p-0 table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Matrícula</th>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Curso</th>
              <th>Status</th>
              <th class="text-center" style="width: 140px;">Ações</th>
            </tr>
          </thead>
          
          <tbody id="tabela-alunos"></tbody>
        </table>
      </div>
    </div>

  </div>

  
  <script src="alunos.js"></script>
</body>
</html>
